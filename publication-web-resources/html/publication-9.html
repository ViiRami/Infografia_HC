  <h1>Toxicidad reproductiva</h1>
  
  <p>
    <strong class="subtitulo">¿En qué consiste?</strong><br>
   Analiza si un químico afecta la fertilidad de los animales o el desarrollo de las crías cuando la madre está embarazada.<br>
    <strong class="subtitulo">Objetivo</strong><br>
    Sirve para asegurar que una sustancia no cause abortos o malformaciones en los bebés (efectos teratogénicos). Se vigila tanto a los padres como el nacimiento y crecimiento de las crias.<br>
  </p>

  <h1>Carcinogenicidad</h1>
  
  <p>
    <strong class="subtitulo">¿En qué consiste?</strong><br>
Es una prueba específica para averiguar si una sustancia tiene la capacidad de provocar cáncer.<br>
    <strong class="subtitulo">Objetivo</strong><br>
  Se expone a los animales al compuesto durante la mayor parte de su ciclo de vida natural. Los científicos monitorean constantemente el cuerpo de los sujetos de prueba para ver si desarrollan tumores malignos o anomalías en la multiplicación celular.<br>
  </p>
