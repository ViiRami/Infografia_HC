  <h1>Toxicidad subcrónica</h1>
  
  <p>
    <strong class="subtitulo">¿En qué consiste?</strong><br>
   Estudia los efectos de un ingrediente cuando el animal se expone a él de forma repetida durante un tiempo mediano, que suele ser entre 1 y 3 meses.<br>
    <strong class="subtitulo">Objetivo</strong><br>
   Sirve para ver cómo reacciona el cuerpo a largo plazo y si el químico se va acumulando poco a poco en órganos vitales como los pulmones, el hígado o los riñones, enfermándolos lentamente.<br>
  </p>

  <h1>Toxicidad crónica</h1>
  
  <p>
    <strong class="subtitulo">¿En qué consiste?</strong><br>
   Es muy parecida a la anterior, pero dura casi toda la vida del animal (pueden ser de 6 meses a 2 años en el caso de los roedores).<br>
    <strong class="subtitulo">Objetivo</strong><br>
  Se utiliza para simular lo que pasaría si un humano consume o usa un producto diariamente durante muchos años. Al final del estudio, los animales son sacrificados para examinar de cerca si sufrieron daños internos permanentes.<br>
  </p>
