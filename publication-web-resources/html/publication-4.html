    <h1>Países de América</h1>
    
    <h2 class="subtitulo">Prohibición total</h2>
    <p class="aclaracion">(Ensayos locales + importación y comercialización de productos testeados)</p>

    <p><strong class="pais">Colombia:</strong> Ley 2047 de 2020 prohíbe de forma integral el uso de animales para pruebas cosméticas, así como la fabricación, importación y comercialización de cosméticos testeados.</p>

    <p><strong class="pais">México:</strong> La reforma a la Ley General de Salud veta las pruebas directas y la puesta en el mercado de productos que hayan recurrido a nuevos testeos en animales.</p>

    <p><strong class="pais">Canadá:</strong> Mediante el Bill C-47, prohíbe las pruebas locales en cosméticos e impide la venta de artículos respaldados por datos nuevos obtenidos de experimentación animal.</p>

    <p><strong class="pais">Chile:</strong> Modificación al Código Sanitario que prohíbe ensayos cosméticos nacionales y restringe la venta e ingreso de productos cosméticos probados en animales.</p>

    <h2 class="subtitulo">Prohibición parcial</h2>
    <p class="aclaracion">(Únicamente ensayos locales o restricciones con excepciones)</p>

    <p><strong class="pais">Brasil:</strong> Prohibición federal de ensayos en animales en territorio nacional para ingredientes y cosméticos con alternativas validadas, pero sin un veto aduanero integral de importación a nivel nacional.</p>

    <p><strong class="pais">Guatemala:</strong> La Ley de Protección y Bienestar Animal prohíbe los ensayos en animales en el país, pero carece de un veto explícito a la importación/comercialización de productos extranjeros previamente testeados.</p>

    <p><strong class="pais">Ecuador:</strong> Aplica principios constitucionales y de bienestar ambiental para restrin
gir pruebas toxicológicas cosméticas locales, sin una prohibición comercial explícita en frontera.</p>

  <h1>Países Oceanía</h1>

  <strong class="subtitulo">Prohibición total:</strong>
  <ul>
    <li>Nueva Zelanda: Prohibición firme de ensayos cosméticos en animales dentro del país bajo el Animal Welfare Amendment Act, complementada con restricciones a la venta.</li>
  </ul>

  <strong class="subtitulo">Prohibición parcial:</strong>
  <ul>
    <li>Australia: La legislación nacional prohíbe el uso de datos derivados de pruebas en animales para justificar la seguridad de ingredientes cosméticos nuevos (Industrial Chemicals Act), pero no aplica una prohibición general o absoluta en todas las fases de comercialización preexistentes.</li>
  </ul>

  <h1>Países Asia</h1>

  <strong class="subtitulo">Prohibición total:</strong>
  <ul>
    <li>India: Veta por completo tanto las pruebas en animales en territorio nacional (2013) como la importación de cosméticos testeados o con ingredientes probados en animales (2014).</li>
    <li>Israel: Ley que prohíbe el uso de animales en pruebas cosméticas locales y veta la importación/venta de productos e ingredientes cosméticos probados en animales.</li>
  </ul>

  <strong class="subtitulo">Prohibición parcial o condicionada:</strong>
  <ul>
    <li>Corea del Sur: Prohíbe la elaboración y distribución de cosméticos testeados, pero mantiene excepciones explícitas cuando se exigen pruebas para cumplir con regulaciones de otros mercados o cuando no existen alternativas oficialmente reconocidas.</li>
    <li>Taiwán: La enmienda a la Ley de Control de Higiene Cosmética prohíbe ensayos cosméticos nacionales, aunque cuenta con salvaguardas limitadas en importación frente a ingredientes específicos sin prueba alternativa validada.</li>
    <li>Turquía: Su reglamento técnico prohíbe las pruebas en cosméticos cuando existen métodos alternativos reconocidos, armonizando parcialmente con directivas europeas pero sin un veto absoluto a todo el historial de ingredientes.</li>
  </ul>
