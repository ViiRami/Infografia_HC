  <h1>Toxicidad ambiental</h1>
  
  <p>
    <strong class="subtitulo">¿En qué consiste?</strong><br>
   Esta prueba no busca proteger al humano, sino medir el impacto de los químicos industriales en los ecosistemas de la naturaleza.<br>
    <strong class="subtitulo">Objetivo</strong><br>
     Se introducen sustancias (como pesticidas o aguas contaminadas) en ambientes controlados con peces, ranas, pulgas de agua o aves. Sirve para calcular qué tanto daño causa un derrame químico en la fauna de los ríos o bosques.<br>
  </p>

  <h1>Modificación genética e inyección de embriones</h1>
  
  <p>
    <strong class="subtitulo">¿En qué consiste?</strong><br>
Consiste en alterar el ADN de un animal desde que es una sola célula o un embrión microscópico en el laboratorio.<br>
    <strong class="subtitulo">Objetivo</strong><br>
  Mediante microinyecciones, los científicos quitan, añaden o cambian genes en los embriones. Esto se hace para que el animal nazca con enfermedades humanas idénticas (como diabetes o tumores específicos) y así poder probar nuevos medicamentos directamente en ellos.<br>
  </p>
