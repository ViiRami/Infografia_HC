<div id="texto" tabindex="0" aria-label="texto">
  <h1>Prueba draize</h1>
  
  <p>
    <strong class="subtitulo">¿En qué consiste?</strong><br>
   Se usa para medir qué tan irritante es un producto. Los científicos aplican directamente gotas de champú, maquillaje o químicos en los ojos o en la piel afeitada de conejos vivos.<br>
    <strong class="subtitulo">Objetivo</strong><br>
   es observar si el producto causa quemaduras, úlceras o ceguera para evitar que eso le pase a los humanos. Los conejos suelen pasar días inmovilizados para que no se rasquen.<br>
  </p>

  <h1>Toxicidad aguda</h1>
  
  <p>
    <strong class="subtitulo">¿En qué consiste?</strong><br>
   Evalúa el peligro de una sustancia tras una sola dosis fuerte o una exposición muy corta (menos de 24 horas).<br>
    <strong class="subtitulo">Objetivo</strong><br>
   Se obliga a un grupo de animales (como ratas o ratones) a ingerir, respirar o recibir una inyección del químico. El fin es descubrir qué tanta cantidad de esa sustancia causa daño inmediato, convulsiones o incluso la muerte.<br>
  </p>
